name: E2E

# The opt-in end-to-end suite (e2e/, make e2e): installs this branch's
# builds on the runner, which has systemd, Docker and sudo, and drives the
# admin panel's HTTPS API through it. One job per setup: install.sh with
# the panel in Docker or as a systemd service, and docker compose.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tests that skip unless root, such as giving a rewritten file back to
  # the server container's user.
  as-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Go tests as root
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -count=1 -run 'Owner' -v ./internal/serverconfig/

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        setup: [script-docker, script-systemd, compose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: End-to-end, ${{ matrix.setup }}
        run: make e2e E2E_SETUP=${{ matrix.setup }}
      # The suite dumps these itself when a flow fails; this covers a
      # timeout or crash that skips its cleanup.
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u thefeed-server -u thefeed-admin --no-pager -n 300 || true
          sudo docker logs -n 300 thefeed-server || true
          sudo docker logs -n 300 thefeed-admin || true
