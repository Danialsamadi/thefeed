# ============================================================
# thefeed-server and its admin panel — Docker Compose
# ============================================================
#
#   mkdir -p data && cp .env.example data/thefeed.env
#   printf 'THEFEED_LISTEN=:5300\nTHEFEED_NO_TELEGRAM=1\n' >> data/thefeed.env
#   nano data/thefeed.env                                   # domain and key
#   cp configs/channels.txt data/
#   sudo chown -R 1000:1000 data                            # the server is uid 1000
#   docker compose up -d
#   docker logs thefeed-admin                               # panel URL and setup code
#
# Settings live in data/thefeed.env, which the server and the panel read
# themselves. Don't give the server environment:, env_file: or settings
# flags here: they beat thefeed.env, and the panel's changes would be
# ignored.
#
# Build from source instead of pulling: uncomment the build: lines, then
# `docker compose up -d --build`.
# ============================================================

services:
  server:
    image: ${THEFEED_SERVER_IMAGE:-ghcr.io/sartoopjj/thefeed-server}:${THEFEED_SERVER_TAG:-latest}
    # build: { context: ., target: server }
    container_name: thefeed-server
    restart: unless-stopped
    ports:
      - "5300:5300/udp"
    volumes:
      - ./data:/data

  admin:
    image: ${THEFEED_ADMIN_IMAGE:-ghcr.io/sartoopjj/thefeed-admin}:${THEFEED_ADMIN_TAG:-latest}
    # build: { context: ., target: admin }
    container_name: thefeed-admin
    restart: unless-stopped
    # Root on the host, as the systemd panel is: it controls the server
    # container, reads the host's journal and can reboot.
    privileged: true
    pid: host
    network_mode: host
    environment:
      THEFEED_ADMIN_SERVER: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/thefeed
      - /etc/systemd/system:/etc/systemd/system:ro
