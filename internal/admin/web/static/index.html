<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thefeed admin</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/admin.css">
<!-- The shell first, then one script per page: each page registers itself
     with Panel (see the top of shell.js). -->
<script src="/static/js/util.js" defer></script>
<script src="/static/js/shell.js" defer></script>
<script src="/static/js/control-util.js" defer></script>
<script src="/static/js/control.js" defer></script>
<script src="/static/js/board-util.js" defer></script>
<script src="/static/js/pages/board.js" defer></script>
<script src="/static/js/pages/server.js" defer></script>
<script src="/static/js/pages/service.js" defer></script>
<script src="/static/js/pages/alerts.js" defer></script>
<script src="/static/js/pages/chan.js" defer></script>
<script src="/static/js/pages/xacc.js" defer></script>
<script src="/static/js/pages/chat.js" defer></script>
<script src="/static/js/pages/mt.js" defer></script>
<script src="/static/js/pages/media.js" defer></script>
<script src="/static/js/pages/fetch.js" defer></script>
<script src="/static/js/pages/dns.js" defer></script>
<script src="/static/js/pages/account.js" defer></script>
<script src="/static/js/pages/appearance.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <div class="app-in" hidden>
    <nav class="nav" aria-label="Admin sections"></nav>
    <div class="split split-nav" data-split="nav" role="separator" aria-orientation="vertical" aria-label="Sidebar width" tabindex="0" title="Drag to resize. Double-click to reset."></div>
    <section class="view v-board" aria-label="Board">
      <div class="list-pane"><div class="scroll"></div><div class="split" data-split="list" role="separator" aria-orientation="vertical" aria-label="List width" tabindex="0" title="Drag to resize. Double-click to reset."></div></div>
      <div class="thread-pane"><div class="scroll"></div></div>
    </section>
    <section class="view v-server" aria-label="Server" hidden><div class="scroll"></div></section>
    <section class="view v-control" aria-label="Control" hidden>
      <div class="list-pane"><div class="scroll"></div><div class="split" data-split="list" role="separator" aria-orientation="vertical" aria-label="List width" tabindex="0" title="Drag to resize. Double-click to reset."></div></div>
      <div class="thread-pane"><div class="scroll"></div></div>
    </section>
  </div>
  <div class="auth"></div>
</div>
</body>
</html>
